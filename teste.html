<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste de tela cheia</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: transparent; }
  #info { position: fixed; left: 12px; bottom: 12px; z-index: 10; padding: 10px 14px; max-width: 1100px;
          background: rgba(0,0,0,.78); color: #9ff59f; font: 22px/1.4 monospace; white-space: pre-wrap;
          border: 1px solid #9ff59f; border-radius: 8px; }
</style>
</head>
<body>
<!-- 1.3.1: o video publico https apareceu em tela cheia (1.3.0). Agora um video publico
     em http, como os canais dos paineis, dentro desta pagina https.
     Teste isolado da tela cheia na Samsung dentro do MSX (app web 1.3.0). O SmartMSX abre
     o app por https nessa TV e mostra video em tela cheia; o nosso, por http, so mostra
     video pequeno. Esta pagina, por https, toca um video publico de teste (HLS, https) ja
     em 1920x1080, direto no <video> - sem painel Xtream, sem mpegts.js. -->
<video id="v" autoplay playsinline muted
       src="http://devimages.apple.com/iphone/samples/bipbop/bipbopall.m3u8"></video>
<div id="info">carregando...</div>
<script>
(function () {
  var v = document.getElementById("v");
  var info = document.getElementById("info");
  function atualizar() {
    info.textContent =
      "TESTE TELA CHEIA 1.3.1  pagina " + location.protocol + "  video http (publico)\n" +
      "video: rs=" + v.readyState + " " + v.videoWidth + "x" + v.videoHeight +
      " t=" + (v.currentTime || 0).toFixed(1) + (v.paused ? " pausado" : " tocando") +
      (v.error ? "  erro " + v.error.code : "") + "\n" +
      "Se aparecer o video de teste (bipbop) em tela cheia, video http toca dentro do https.\n" +
      "Aperte Voltar para sair.";
  }
  setInterval(atualizar, 1000);
  atualizar();
  try { v.play(); } catch (e) {}
})();
</script>
</body>
</html>
